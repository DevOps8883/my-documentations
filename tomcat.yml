---
- name: Install and configure Apache Tomcat
  hosts: all
  become: true

  vars:
    tomcat_version: 9.0.105
    tomcat_user: tomcat
    tomcat_group: tomcat
    tomcat_home: /opt/tomcat
    tomcat_url: "https://downloads.apache.org/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"

  tasks:

    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Java (default-jdk)
      apt:
        name: default-jdk
        state: present

    - name: Create tomcat group
      group:
        name: "{{ tomcat_group }}"
        state: present

    - name: Create tomcat user
      user:
        name: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        home: "{{ tomcat_home }}"
        shell: /bin/false
        system: yes
        create_home: no

    - name: Download Tomcat archive
      get_url:
        url: "{{ tomcat_url }}"
        dest: /tmp/apache-tomcat-{{ tomcat_version }}.tar.gz
        mode: '0644'

    - name: Create Tomcat installation directory
      file:
        path: "{{ tomcat_home }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: Extract Tomcat
      shell: |
        mkdir -p {{ tomcat_home }}
        tar xzf /tmp/apache-tomcat-{{ tomcat_version }}.tar.gz -C {{ tomcat_home }} --strip-components=1
      args:
        executable: /bin/bash

    - name: Set ownership of Tomcat directory
      file:
        path: "{{ tomcat_home }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        recurse: yes

    - name: Make Tomcat scripts executable
      file:
        path: "{{ tomcat_home }}/bin"
        mode: '0755'
        recurse: yes

    - name: Configure tomcat-users.xml
      copy:
        dest: "{{ tomcat_home }}/conf/tomcat-users.xml"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <tomcat-users>
              <role rolename="manager-gui"/>
              <role rolename="manager-script"/>
              <user username="admin" password="admin123"
                    roles="manager-gui,manager-script"/>
          </tomcat-users>
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0644'

    # Ensure META-INF directories exist so templates will succeed
    - name: Ensure Manager META-INF directory exists
      file:
        path: "{{ tomcat_home }}/webapps/manager/META-INF"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    - name: Ensure Host Manager META-INF directory exists
      file:
        path: "{{ tomcat_home }}/webapps/host-manager/META-INF"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"

    # Copy templates to disable <Valve>
    - name: Configure Manager context.xml
      template:
        src: templates/manager-context.xml.j2
        dest: "{{ tomcat_home }}/webapps/manager/META-INF/context.xml"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0644'

    - name: Configure Host Manager context.xml
      template:
        src: templates/host-manager-context.xml.j2
        dest: "{{ tomcat_home }}/webapps/host-manager/META-INF/context.xml"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: '0644'

    - name: Stop Tomcat if running
      command: "{{ tomcat_home }}/bin/shutdown.sh"
      ignore_errors: yes

    - name: Start Tomcat
      command: "{{ tomcat_home }}/bin/startup.sh"


